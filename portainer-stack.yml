services:
  app:
    image: ${BACKEND_IMAGE:-jcinformatica/circles-backend:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: ${PROD_APP_NAME:-Circles Imobiliaria}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${PROD_APP_KEY:?Configure a chave existente em PROD_APP_KEY}
      APP_URL: ${PROD_APP_URL:?Configure a URL publica HTTPS em PROD_APP_URL}
      API_VERSION: ${PROD_API_VERSION:-v1}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${PROD_LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${PROD_DB_DATABASE:-imobiliaria}
      DB_USERNAME: ${PROD_DB_USERNAME:-imobiliaria}
      DB_PASSWORD: ${PROD_DB_PASSWORD:?Configure PROD_DB_PASSWORD}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${PROD_SESSION_SECURE_COOKIE:-true}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: ${PROD_FILESYSTEM_DISK:-public}
      CORS_ALLOWED_ORIGINS: ${PROD_CORS_ALLOWED_ORIGINS:-*}
      SANCTUM_STATEFUL_DOMAINS: ${PROD_SANCTUM_STATEFUL_DOMAINS:-localhost}
    depends_on:
      - db
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - backend

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PROD_DB_DATABASE:-imobiliaria}
      MYSQL_USER: ${PROD_DB_USERNAME:-imobiliaria}
      MYSQL_PASSWORD: ${PROD_DB_PASSWORD:?Configure PROD_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD:?Configure PROD_DB_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

volumes:
  db_data:
  backend_storage:

networks:
  backend:
